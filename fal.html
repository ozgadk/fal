<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falcı Panda · The Snuggest</title>
<meta name="theme-color" content="#200b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap&subset=cyrillic,latin-ext" rel="stylesheet">
<style>
:root{--ink:#fff3d6;--muted:#d9c2ff;--gold:#f1b94a;--pink:#ff8cc0;--line:rgba(201,166,255,.4);--serif:"Alegreya",Georgia,serif;--sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#0d0518}
body{color:var(--ink);font-family:var(--sans);font-size:17px;-webkit-tap-highlight-color:transparent;background:radial-gradient(circle at 50% 18%,#4a1d7a 0%,#200b3d 55%,#0d0518 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#ffd96b,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#ffd96b,transparent),radial-gradient(1.5px 1.5px at 60% 90%,#fff,transparent),radial-gradient(2px 2px at 92% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 33% 12%,#ffd96b,transparent);
  animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.35}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative}
.scr{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(34px + env(safe-area-inset-bottom,0px));min-height:100vh}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;align-self:flex-end}
.langs button{padding:7px 11px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1a0d10}
.art svg{width:100%;height:auto;display:block;overflow:visible}
.art.big{width:min(280px,72vw);margin-top:6px;animation:fin .8s cubic-bezier(.2,1.3,.4,1) both}
.art.mid{width:200px}.art.sm{width:96px;flex:none}
@keyframes fin{from{opacity:0;transform:translateY(24px) scale(.92)}}
.ttl{font-family:var(--serif);font-size:34px;line-height:1.1;margin:8px 0;background:linear-gradient(90deg,#ffd96b,#ff8cc0,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl.sm{font-size:26px}
.lead{color:#e3d2ff;line-height:1.45;font-size:18px;max-width:440px;margin:0 0 18px}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
.btn{display:block;width:100%;max-width:440px;margin:16px auto 0;padding:17px;border-radius:16px;font-weight:700;font-size:18px;color:#1a0d10;background:linear-gradient(90deg,#ffd96b,#ff8cc0);box-shadow:0 8px 26px rgba(255,140,192,.35)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ig{background:linear-gradient(90deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.bk{color:var(--muted);font-weight:700;padding:6px 0;margin-bottom:6px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.choices{display:grid;gap:14px;width:100%;margin-top:4px}
.choice{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto auto;align-items:center;column-gap:14px;text-align:left;padding:16px;border-radius:20px;background:linear-gradient(120deg,rgba(255,255,255,.1),rgba(255,140,192,.08));border:1px solid var(--line)}
.choice .cv{grid-row:1/3;height:96px;display:grid;place-items:center;position:relative}
.choice .cv svg{max-height:96px;width:auto}
.choice .fan i{position:absolute;width:50px;transform:rotate(var(--r)) translateY(4px);transform-origin:50% 100%}
.choice .fan i svg{width:100%;height:auto}
.choice b{font-family:var(--serif);font-size:23px;color:#ffe2a8}
.choice small{color:var(--muted);line-height:1.35;font-size:15px}
.lbl{display:block;color:var(--muted);font-weight:700;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:500}
.chips button[aria-pressed="true"]{background:var(--gold);color:#1a0d10;border-color:var(--gold);font-weight:700}
.tx{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical}
.tx::placeholder{color:#a58fc8}
.spreads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spreads button{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);text-align:left}
.spreads button[aria-pressed="true"]{border-color:var(--gold);background:rgba(241,185,74,.16);box-shadow:0 0 0 1px var(--gold)}
.spreads b{display:block;font-family:var(--serif);font-size:20px;color:#ffe2a8}.spreads small{color:var(--muted)}
/* shuffle */
.shuf{position:relative;width:140px;height:240px;margin:60px auto 30px}
.shuf i{position:absolute;inset:0;animation:sh 1.3s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
.shuf i svg{width:100%;height:100%}
@keyframes sh{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-70px) rotate(-12deg)}75%{transform:translateX(70px) rotate(12deg)}}
.shuf i:nth-child(even){animation-direction:reverse}
/* pick */
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.slot{position:relative;width:62px;aspect-ratio:200/340;border-radius:8px;border:1.5px dashed var(--line);display:block}
.slots.celtic .slot{width:44px}
.slot.on{border:0;animation:pop .35s ease}
.slot svg{width:100%;height:100%;display:block}
.slot em{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap;margin-top:3px}
.slots.celtic .slot em{display:none}
@keyframes pop{50%{transform:scale(1.15)}}
.cnt{text-align:center;color:var(--gold);font-weight:700;margin:22px 0 4px}
.strip{display:flex;overflow-x:auto;padding:26px 18px 30px;margin:0 -18px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sc{flex:none;width:86px;margin-right:-50px;transition:transform .25s,opacity .25s;animation:dealin .5s ease both;animation-delay:var(--d)}
.sc svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.sc:hover,.sc:focus-visible{transform:translateY(-14px)}
.sc.gone{transform:translateY(-120px) scale(.6);opacity:0}
@keyframes dealin{from{opacity:0;transform:translateY(30px)}}
/* reveal layout */
.lay{position:relative;margin:10px auto 6px}
.lay.three{display:flex;gap:12px;justify-content:center;width:100%}
.lay.three .lc{width:31%;max-width:150px;aspect-ratio:200/340}
.lay.celtic{width:min(100%,360px);aspect-ratio:360/420}
.lay.celtic .lc{position:absolute;width:15.5%;aspect-ratio:200/340}
.lc{perspective:900px}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flipc .9s cubic-bezier(.3,1.3,.5,1) both;animation-delay:var(--d)}
@keyframes flipc{from{transform:rotateY(180deg)}}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fb{transform:rotateY(180deg)}
.fb svg,.ff svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px rgba(176,124,255,.55))}
.lay.celtic .p0{left:23%;top:30%}.lay.celtic .p1{left:23%;top:30%;transform:rotate(90deg);z-index:2}.lay.celtic .p2{left:23%;top:62%}.lay.celtic .p3{left:4%;top:30%}
.lay.celtic .p4{left:23%;top:-2%}.lay.celtic .p5{left:42%;top:30%}.lay.celtic .p6{left:76%;top:75%}.lay.celtic .p7{left:76%;top:50%}.lay.celtic .p8{left:76%;top:25%}.lay.celtic .p9{left:76%;top:0}
.names{text-align:left;width:100%;max-width:440px;margin:18px auto 0;padding-left:22px;line-height:1.5}
.names em{color:var(--gold);font-style:normal;font-weight:700}
.names small{color:var(--muted)}
/* coffee */
.steps{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.35}
.steps span{font-size:22px}
.phs{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-top:18px}
.ph{position:relative;aspect-ratio:1;border-radius:16px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);text-align:center;padding:6px}
.ph.req{border-color:var(--gold)}
.ph span{font-size:30px}.ph small{font-size:12px;color:var(--muted);line-height:1.2}
.ph.on{border-style:solid}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.on small{position:absolute;bottom:0;left:0;right:0;background:rgba(13,5,24,.7);padding:4px}
.err{color:#ff9db0;min-height:1.2em;margin:10px 0 0}
/* panda animations */
.fpanda .feyes{transform-origin:160px 143px;animation:blink 4.5s infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.fpanda .fglow{transform-origin:160px 268px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.12);opacity:.7}}
.fpanda .fmist{transform-origin:160px 268px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fpanda .fsp path{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.fpanda .fpaws{animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-5px)}}
.fpanda .ffeather{transform-box:fill-box;transform-origin:0% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-8deg)}}
.reading .fpanda .fmist{animation-duration:1.2s}.reading .fpanda .fglow{animation-duration:.6s}
.reading .fpanda .fpaws{animation:rub .35s ease-in-out infinite}
@keyframes rub{50%{transform:translate(4px,-4px)}}
/* result */
.res .rhead{text-align:center;display:flex;flex-direction:column;align-items:center}
.res .rhead small{color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
blockquote{margin:10px 0 18px;padding:16px 18px;border-radius:18px;background:linear-gradient(120deg,rgba(255,140,192,.18),rgba(176,124,255,.18));border:1px solid var(--line);font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.4;color:#ffe2a8;text-align:center}
.rcards{display:flex;justify-content:center;gap:10px;margin:8px 0 18px;flex-wrap:wrap}
.rcards .rc{width:30%;max-width:140px}.rcards.celtic .rc{width:17%}
.rcards svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 12px rgba(176,124,255,.5))}
section{margin:0 0 18px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:16px}
section h2{font-family:var(--serif);font-size:23px;margin:0 0 8px;color:#ffd96b}
section p{margin:0;line-height:1.55;color:#f3e8ff}
.rcard{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rcard:first-of-type{border-top:0;padding-top:0}
.rcard .mini svg{width:100%;height:auto;display:block}
.rcard em{display:block;font-style:normal;color:var(--gold);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.rcard b{display:block;font-family:var(--serif);font-size:20px;margin:2px 0 6px}
.rcard b small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.cupimg{width:220px;aspect-ratio:1;margin:6px auto 18px;border-radius:50%;overflow:hidden;border:6px solid var(--gold);box-shadow:0 0 40px rgba(176,124,255,.6)}
.cupimg img{width:100%;height:100%;object-fit:cover}
.syms{display:grid;gap:10px}
.sym{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2)}
.sym b{font-family:var(--serif);font-size:19px;color:#ffe2a8}.sym em{display:block;color:var(--muted);font-size:14px;margin:2px 0 4px}
.area{padding:10px 0;border-top:1px solid var(--line)}.area:first-of-type{border-top:0;padding-top:0}
.area b{display:block;color:var(--gold);margin-bottom:4px}
.msg{background:linear-gradient(120deg,rgba(241,185,74,.14),rgba(176,124,255,.14))}
.adv{margin:0;padding-left:22px;line-height:1.55}.adv li{margin-bottom:6px}
.pair{display:flex;gap:12px;align-items:flex-start}
.pair span{font-size:34px}.pair em{font-style:normal;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase}.pair b{display:block;font-family:var(--serif);font-size:22px;color:#ffe2a8}
.share{margin-top:6px}
.msgl{text-align:center;color:var(--muted);min-height:1.2em}
.disc{text-align:center;color:#a58fc8;font-size:14px;margin-top:22px}
.foot{text-align:center;color:#a58fc8;font-size:14px}.foot a{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>

function shuffleDeck(){const d=[...Array(78).keys()];for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
document.addEventListener('click',async e=>{

  }

  else if(a==='story')shareImgs('story');

});
document.addEventListener('change',async e=>{
  const inp=e.target;if(!inp.dataset||inp.dataset.ph==null)return;const i=+inp.dataset.ph,f=inp.files&&inp.files[0];if(!f)return;
  const q=$('#q');if(q)st.q=q.value;
  try{st.imgs[i]=await compress(f,1280,.82);if(i===0)st.thumb=await compress(f,420,.8);st.cerr=''}catch(x){st.cerr=t('notCup')}

});
async function compress(file,max,qual){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',qual)}finally{URL.revokeObjectURL(url)}
}
async function doRead(kind){
  st.kind=kind;st.screen='wait';render();
  const body={code:CODE,kind,lang,topic:st.topic,question:st.q.trim(),drinks:DRINKS};
  if(kind==='tarot'){body.spread=st.spread;body.cards=st.picks.map(p=>({id:p.id,rev:p.rev}))}
  else body.images=st.imgs.filter(Boolean);
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),150000);
  try{
    const r=await fetch(WORKER+'/fal/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    const d=await r.json().catch(()=>({}));clearTimeout(to);
    if(d.status==='used'){showUsed(d,kind,body);return}
    if(d.error==='not_cup'){st.screen='error';st.err=t('notCup')+' '+(d.reason||'')+' '+t('retake');st.retry='retrycup';st.retryLabel=t('addPh');render();return}
    if(d.error==='busy'){st.screen='error';st.err=t('busy');st.retry=null;render();return}
    if(d.error==='invalid'){st.screen='error';st.err=t('invalid');st.retry=null;render();return}
    st.screen='error';st.err=t('aiFail');st.retry='retryread';st.retryLabel='🔮 '+t('readBtn');render();
  }catch(x){clearTimeout(to);
    // bağlantı koptuysa okuma worker'da sürüyor/bitmiş olabilir: sonucu /fal/check ile bekle
    if(await pollResult(kind,body))return;
    st.screen='error';st.err=t('net');st.retry='retryread';st.retryLabel='🔮 '+t('readBtn');render()}
}
function showUsed(d,kind,body){
  st.result=d.result;st.cards=d.cards||(kind==='tarot'?body.cards:null);st.kind=d.kind||kind;st.screen='result';
  LSs('fal.res.'+CODE,{kind:st.kind,result:st.result,cards:st.cards});if(st.thumb)LSs('fal.thumb.'+CODE,st.thumb);
  render();scrollTo(0,0);
}
async function pollResult(kind,body){
  const end=Date.now()+150000;
  while(Date.now()<end){
    await new Promise(r=>setTimeout(r,4000));
    try{const r=await fetch(WORKER+'/fal/check?c='+encodeURIComponent(CODE));const d=await r.json();
      if(d.status==='used'){showUsed(d,kind,body);return true}
      if(d.status!=='busy')return false;
    }catch(e){}
  }
  return false;
}

/* ---------- share images ---------- */
function svgImg(svg,w,h){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ',`<svg width="${w}" height="${h}" `))})}
function urlImg(u){return new Promise(r=>{if(!u)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u})}
function wrap(g,text,maxW){const out=[];String(text||'').split('\n').forEach(par=>{const w=par.split(' ');let cur='';for(const x of w){const tt=cur?cur+' '+x:x;if(g.measureText(tt).width>maxW&&cur){out.push(cur);cur=x}else cur=tt}out.push(cur)});return out}
function bgNight(g,W,H,seed){
  const bg=g.createRadialGradient(W/2,H*.32,40,W/2,H*.45,H*.8);bg.addColorStop(0,'#4a1d7a');bg.addColorStop(.55,'#200b3d');bg.addColorStop(1,'#0d0518');
  g.fillStyle=bg;g.fillRect(0,0,W,H);let s=seed||7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<150;i++){g.globalAlpha=.2+r()*.7;g.fillStyle=r()<.2?'#ffd96b':'#fff';g.beginPath();g.arc(r()*W,r()*H,r()*2.4+.5,0,7);g.fill()}
  g.globalAlpha=1;const cols=['#9bd04f','#4fd1b5','#4fc3f7','#b07cff','#ff5d73','#ffb23f','#f1b94a'];cols.forEach((c,i)=>{g.fillStyle=c;g.fillRect(i*W/7,0,W/7+1,12)});
}
function brand(g,W,y){g.textAlign='center';g.fillStyle='#f1b94a';g.font='600 30px "Alegreya Sans",sans-serif';g.fillText('T  H  E',W/2,y);g.fillStyle='#fff3d6';g.font='700 80px Alegreya,Georgia,serif';g.fillText('SNUGGEST',W/2,y+78)}
function foot(g,W,H){g.textAlign='center';g.fillStyle='#f1b94a';g.font='700 40px "Alegreya Sans",sans-serif';g.fillText('@thesnuggest',W/2,H-110);g.fillStyle='#bba184';g.font='500 30px "Alegreya Sans",sans-serif';g.fillText('Zirgu iela 3 · Vecrīga · Rīga',W/2,H-62)}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const CELTIC_POS=[[1.5,1.5],[1.5,1.5,90],[1.5,3],[0,1.5],[1.5,0],[3,1.5],[4.6,3.3],[4.6,2.2],[4.6,1.1],[4.6,0]];
async function drawCards(g,cards,x,y,w,h){
  if(!cards||!cards.length)return;
  if(cards.length===10){
    const cw=Math.min(w/6.2,h/4.6*0.6),ch=cw*1.7,ux=cw*1.05,uy=ch*.98*0.82,ox=x+(w-ux*5.6)/2,oy=y+(h-uy*4.1)/2;
    for(let i=0;i<10;i++){const c=cards[i],p=CELTIC_POS[i];const im=await svgImg(cardSVG(c.id,cName(c.id),c.rev,'sx'+i),cw*2,ch*2);if(!im)continue;
      const cx=ox+p[0]*ux+cw/2,cy=oy+(i>=6?(3.3-(i-6)*1.1):p[1])*uy+ch/2;g.save();g.translate(cx,cy);if(p[2])g.rotate(Math.PI/2);g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=20;g.drawImage(im,-cw/2,-ch/2,cw,ch);g.restore()}
  }else{
    const n=cards.length,gap=w*.04,cw=Math.min((w-gap*(n-1))/n,h/1.7),ch=cw*1.7,tot=n*cw+(n-1)*gap;
    for(let i=0;i<n;i++){const c=cards[i];const im=await svgImg(cardSVG(c.id,cName(c.id),c.rev,'sy'+i),cw*2,ch*2);if(!im)continue;
      g.save();const cx=x+(w-tot)/2+i*(cw+gap)+cw/2,cy=y+h/2;g.translate(cx,cy);g.rotate((i-(n-1)/2)*0.05);g.shadowColor='rgba(176,124,255,.6)';g.shadowBlur=40;g.drawImage(im,-cw/2,-ch/2,cw,ch);g.restore()}
  }
}
async function drawPhoto(g,cx,cy,r){
  const im=await urlImg(st.thumb);
  g.save();g.shadowColor='rgba(176,124,255,.7)';g.shadowBlur=60;g.beginPath();g.arc(cx,cy,r+14,0,7);g.fillStyle='#f1b94a';g.fill();g.restore();
  g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();
  if(im){const k=Math.max(2*r/im.width,2*r/im.height);g.drawImage(im,cx-im.width*k/2,cy-im.height*k/2,im.width*k,im.height*k)}
  else{const p=await svgImg(pandaSVG('sp'),2*r,2*r*1.125);if(p)g.drawImage(p,cx-r,cy-r*1.1,2*r,2*r*1.125)}
  g.restore();
}
async function makeStory(){
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');try{await document.fonts.ready}catch(e){}
  const r=st.result||{};bgNight(g,W,H,11);brand(g,W,96);
  g.fillStyle='#d9c2ff';g.font='600 40px "Alegreya Sans",sans-serif';g.fillText('🔮 '+t('name')+' · '+(st.kind==='coffee'?t('coffee'):t('tarot')),W/2,262);
  g.fillStyle='#ffe2a8';g.font='700 62px Alegreya,Georgia,serif';wrap(g,r.title||'',W-160).slice(0,2).forEach((l,i)=>g.fillText(l,W/2,360+i*72));
  if(st.kind==='tarot')await drawCards(g,st.cards,60,470,W-120,(st.cards||[]).length===10?780:720);else await drawPhoto(g,W/2,820,320);
  const qy=1260;
  g.fillStyle='#fff3d6';g.font='italic 500 50px Alegreya,Georgia,serif';const ql=wrap(g,'“'+(r.quote||'')+'”',W-180).slice(0,5);ql.forEach((l,i)=>g.fillText(l,W/2,qy+80+i*64));
  if(r.drink){const y=qy+80+ql.length*64+70;g.fillStyle='rgba(241,185,74,.15)';rr(g,140,y-50,W-280,84,42);g.fill();g.fillStyle='#f1b94a';g.font='700 38px "Alegreya Sans",sans-serif';g.fillText('🍸 '+t('pair')+': '+r.drink,W/2,y+5)}
  foot(g,W,H);return new Promise(res=>c.toBlob(res,'image/png'));
}
async function makeCarousel(){
  const W=1080,H=1350,pages=[];const r=st.result||{};try{await document.fonts.ready}catch(e){}
  const newPage=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');bgNight(g,W,H,pages.length*7+3);pages.push(c);return g};
  // cover
  let g=newPage();g.textAlign='center';g.fillStyle='#f1b94a';g.font='600 28px "Alegreya Sans",sans-serif';g.fillText('THE SNUGGEST · '+t('name').toUpperCase(),W/2,80);
  g.fillStyle='#ffe2a8';g.font='700 64px Alegreya,Georgia,serif';wrap(g,r.title||'',W-160).slice(0,2).forEach((l,i)=>g.fillText(l,W/2,170+i*74));
  if(st.kind==='tarot')await drawCards(g,st.cards,60,300,W-120,(st.cards||[]).length===10?700:640);else await drawPhoto(g,W/2,640,280);
  g.fillStyle='#fff3d6';g.font='italic 500 42px Alegreya,Georgia,serif';wrap(g,'“'+(r.quote||'')+'”',W-180).slice(0,3).forEach((l,i)=>g.fillText(l,W/2,1080+i*54));
  // text pages
  const blocks=[];const add=(h,txt,img)=>blocks.push({h,txt,img});
  add(t('ov'),r.overview);
  if(st.kind==='tarot')(r.cards||[]).forEach((c,i)=>add(c.position+' · '+c.card,c.reading,st.cards&&st.cards[i]));
  else{(r.symbols||[]).forEach(s=>add('✦ '+s.symbol,s.location+' — '+s.meaning));(r.areas||[]).forEach(a=>add(a.area,a.reading))}
  if(r.patterns)add(t('pat'),r.patterns);
  add(t('msg'),r.synthesis);
  add(t('adv'),(r.advice||[]).map((a,i)=>(i+1)+'. '+a).join('\n')+(r.drink?`\n\n🍸 ${t('pair')}: ${r.drink}\n${r.drink_reason||''}`:''));
  const LH=50,X=90,MAXY=H-150;let y=MAXY+1;
  const head=g2=>{g2.textAlign='center';g2.fillStyle='#f1b94a';g2.font='600 26px "Alegreya Sans",sans-serif';g2.fillText('THE SNUGGEST · '+t('name').toUpperCase(),W/2,70)};
  for(const b of blocks){
    g=pages[pages.length-1].getContext('2d');
    const imgH=b.img?300:0;
    if(y+150+imgH>MAXY||pages.length===1){g=newPage();head(g);y=140}
    if(b.img){const im=await svgImg(cardSVG(b.img.id,cName(b.img.id),b.img.rev,'cp'+y),352,600);if(im){g.save();g.shadowColor='rgba(176,124,255,.6)';g.shadowBlur=30;g.drawImage(im,W/2-88,y,176,300);g.restore()}y+=320}
    g.textAlign='left';g.fillStyle='#ffd96b';g.font='700 46px Alegreya,Georgia,serif';wrap(g,b.h,W-2*X).forEach(l=>{g.fillText(l,X,y+40);y+=56});y+=10;
    g.fillStyle='#f3e8ff';g.font='400 36px "Alegreya Sans",sans-serif';
    for(const l of wrap(g,b.txt||'',W-2*X)){if(y+LH>MAXY){g=newPage();head(g);y=140;g.textAlign='left';g.fillStyle='#f3e8ff';g.font='400 36px "Alegreya Sans",sans-serif'}g.fillText(l,X,y+36);y+=LH}
    y+=40;
  }
  pages.forEach((c,i)=>{const gg=c.getContext('2d');foot(gg,W,H+30);gg.textAlign='right';gg.fillStyle='#bba184';gg.font='500 26px "Alegreya Sans",sans-serif';gg.fillText((i+1)+' / '+pages.length,W-60,H-40)});
  return Promise.all(pages.map(c=>new Promise(res=>c.toBlob(res,'image/png'))));
}
async function shareImgs(kind){
  const m=$('#smsg');if(m)m.textContent='…';
  try{
    const blobs=kind==='story'?[await makeStory()]:await makeCarousel();
    const files=blobs.map((b,i)=>new File([b],`snuggest-fal-${kind}-${i+1}.png`,{type:'image/png'}));
    if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:'The Snuggest',text:'🔮 @thesnuggest'});if(m)m.textContent='';return}
    for(const f of files){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);await new Promise(r=>setTimeout(r,350))}
    if(m)m.textContent=t('saved');
  }catch(e){if(e&&e.name==='AbortError'){if(m)m.textContent='';return}if(m)m.textContent=t('saved')}
}

boot();
