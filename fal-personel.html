<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falcı Panda · Personel</title>
<meta name="theme-color" content="#200b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff3d6;--muted:#d9c2ff;--gold:#f1b94a;--line:rgba(201,166,255,.4);--danger:#ff9db0;--serif:"Alegreya",Georgia,serif;--sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;color-scheme:dark;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html{background:#0d0518}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:17px;background:radial-gradient(circle at 50% 10%,#4a1d7a,#200b3d 55%,#0d0518) fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 40px}
h1{font-family:var(--serif);font-size:30px;margin:0 0 4px;background:linear-gradient(90deg,#ffd96b,#ff8cc0,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--serif);font-size:22px;margin:24px 0 10px;color:#ffd96b}
p{color:#e3d2ff;line-height:1.45}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:18px;color:#1a0d10;background:linear-gradient(90deg,#ffd96b,#ff8cc0);margin-top:12px}
.btn.big{font-size:21px;padding:22px}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:15px;margin:0}
.btn:disabled{opacity:.5}
label{display:block;color:var(--muted);font-weight:700;margin:14px 0 6px}
input{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:12px}
.err{color:var(--danger);min-height:1.2em}
.row{display:grid;grid-template-columns:auto 56px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:rgba(255,255,255,.05)}
.row .c{font-family:monospace;font-weight:700;letter-spacing:.05em}
.row.used{opacity:.6}
.hd{display:flex;justify-content:space-between;align-items:center}
.ov{position:fixed;inset:0;background:rgba(8,3,16,.8);display:grid;place-items:center;padding:18px;z-index:9}
.md{background:#200b3d;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(420px,100%);text-align:center}
.qr{background:#fff;border-radius:14px;padding:10px}
.qr svg{width:100%;height:auto;display:block}
.code{font-size:24px;letter-spacing:.14em;font-weight:700;margin:12px 0 4px}
.lnk{color:var(--gold);text-decoration:underline;font-weight:700;padding:4px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔮 Falcı Panda</h1>
  <p>Personel ekranı · The Snuggest</p>

  <div id="setup" hidden>
    <h2>Kurulum</h2>
    <p>Bu cihazda bir kez yapılır. Anahtar ve adres sadece bu cihazda saklanır.</p>
    <label for="w">Worker adresi</label>
    <input id="w" placeholder="https://snuggest-fal.….workers.dev">
    <label for="k">Personel anahtarı (Cloudflare'deki STAFF_KEY)</label>
    <input id="k" autocomplete="off" placeholder="en az 16 karakter">
    <button class="lnk" id="gen">Yeni anahtar üret</button>
    <p class="err" id="serr"></p>
    <button class="btn" id="save">Kaydet</button>
  </div>

  <div id="main" hidden>
    <p>Müşteri tarot ya da Türk kahvesi falı istediğinde yeni bir QR oluşturup okutun. Her QR <b>tek kullanımlıktır</b> ve 30 saat geçerlidir.</p>
    <button class="btn big" id="new">🔮 Yeni fal QR'ı oluştur</button>
    <p class="err" id="merr"></p>
    <div class="hd"><h2>Son kodlar</h2><button class="btn ghost sm" id="refresh">Yenile</button></div>
    <div id="list"><p>Yükleniyor…</p></div>
    <p style="margin-top:24px"><button class="lnk" id="settings">Ayarlar (worker adresi / anahtar)</button></p>
  </div>
</div>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const DEFAULT_WORKER='https://snuggest-fal.ozguradk.workers.dev';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let W=get('falp.worker')||DEFAULT_WORKER,K=get('falp.key');
const falUrl=c=>location.origin+location.pathname.replace(/[^/]*$/,'')+'fal.html?c='+c;
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function show(){const ok=W&&K.length>=16;$('#setup').hidden=ok;$('#main').hidden=!ok;$('#w').value=W;$('#k').value=K;if(ok)list()}
async function call(path,opt){
  const r=await fetch(W.replace(/\/+$/,'')+path,{...opt,headers:{'Content-Type':'application/json','X-Staff-Key':K}});
  const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||('HTTP '+r.status));e.code=d.error;throw e}return d;
}
const why=e=>e.code==='staff_key'?'Anahtar Cloudflare\'deki STAFF_KEY ile aynı değil.':e.code==='kv_missing'?'Worker\'a KV (FAL) bağlanmamış.':e.code==='not_found'?'Worker adresi veya kodu yanlış.':'Bağlantı sorunu ('+(e.code||e.message)+')';
async function list(){
  const el=$('#list');
  try{const d=await call('/fal/list',{method:'GET'});const L={new:'Bekliyor',busy:'Okunuyor…',used:'Kullanıldı'};
    el.innerHTML=d.codes.length?d.codes.map(c=>`<div class="row ${c.s}"><span class="c">${esc(c.code)}</span><span>${hm(c.t)}</span><span>${L[c.s]||c.s}${c.kind?` · ${c.kind==='coffee'?'☕ Kahve':'🃏 Tarot'}`:''}</span>${c.s==='new'?`<button class="btn ghost sm" data-qr="${esc(c.code)}">QR</button>`:'<span></span>'}</div>`).join(''):'<p>Henüz kod yok.</p>';
  }catch(e){el.innerHTML=`<p class="err">${esc(why(e))}</p>`}
}
function qr(code){
  if(!window.qrcode){$('#modal').innerHTML=`<div class="ov"><div class="md"><p>QR çizilemedi (internet?). Kod:</p><div class="code">${esc(code)}</div><button class="btn" data-close>Tamam</button></div></div>`;return}
  const q=qrcode(0,'M');q.addData(falUrl(code));q.make();
  $('#modal').innerHTML=`<div class="ov"><div class="md"><div class="qr">${q.createSvgTag({cellSize:8,margin:2,scalable:true})}</div><div class="code">${esc(code)}</div><p>Müşteriye bu ekranı okutun. Kod tek kullanımlıktır.</p><button class="btn" data-close>Tamam</button></div></div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='gen'){const a=new Uint8Array(24);crypto.getRandomValues(a);$('#k').value=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');$('#serr').textContent='Bu anahtarı kopyalayıp Cloudflare\'de STAFF_KEY olarak ekleyin.'}
  else if(b.id==='save'){const w=$('#w').value.trim(),k=$('#k').value.trim();if(!/^https:\/\//.test(w)){$('#serr').textContent='Worker adresi https:// ile başlamalı.';return}if(k.length<16){$('#serr').textContent='Anahtar en az 16 karakter olmalı.';return}W=w;K=k;set('falp.worker',W);set('falp.key',K);show()}
  else if(b.id==='settings'){$('#setup').hidden=false;$('#main').hidden=true;$('#serr').textContent=''}
  else if(b.id==='new'){b.disabled=true;$('#merr').textContent='';try{const d=await call('/fal/new',{method:'POST',body:'{}'});qr(d.code);list()}catch(x){$('#merr').textContent=why(x)}b.disabled=false}
  else if(b.id==='refresh')list();
  else if(b.dataset.qr)qr(b.dataset.qr);
  else if(b.hasAttribute('data-close')){$('#modal').innerHTML='';list()}
});
show();
</script>
</body>
</html>
